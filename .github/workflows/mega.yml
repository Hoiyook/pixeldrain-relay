name: mega
on:
  workflow_dispatch:
    inputs:
      mode:  {required: true, type: string}
      link:  {required: true, type: string}
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pycryptodome 2>/dev/null || pip install --quiet --break-system-packages pycryptodome || true
      - name: Range test
        if: ${{ inputs.mode == 'rangetest' }}
        env:
          LINK: ${{ inputs.link }}
        run: |
          cat > /tmp/rt.py <<'PYSRC'
          import json, random, struct, urllib.request, os
          from Crypto.Cipher import AES
          import sys
          sys.path.insert(0, '.')
          from mega_api import Mega
          m = Mega(sys.argv[1])
          h = 'hGghhQaZ'
          url1, size = m.file_url(h)
          print('size', size)
          r1 = urllib.request.Request(url1, headers={'Range': 'bytes=0-1048575'})
          resp = urllib.request.urlopen(r1, timeout=60)
          print('first 1MB:', resp.status, len(resp.read()))
          # 旧 URL 第二次 Range
          try:
              r2 = urllib.request.Request(url1, headers={'Range': 'bytes=1048576-2097151'})
              resp2 = urllib.request.urlopen(r2, timeout=60)
              print('old url 2nd range:', resp2.status, len(resp2.read()))
          except Exception as e:
              print('old url 2nd range FAILED:', e)
          # 新 URL Range
          url2, _ = m.file_url(h)
          r3 = urllib.request.Request(url2, headers={'Range': 'bytes=1048576-2097151'})
          resp3 = urllib.request.urlopen(r3, timeout=60)
          print('fresh url range:', resp3.status, len(resp3.read()))
          PYSRC
          python3 /tmp/rt.py "$LINK"
