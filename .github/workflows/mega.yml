name: mega
on:
  workflow_dispatch:
    inputs:
      mode:  {required: true, type: string}
      link:  {required: true, type: string}
      handle: {required: false, type: string, default: ''}
      asset: {required: false, type: string, default: ''}
      finalname: {required: false, type: string, default: ''}
      tag:   {required: false, type: string, default: ''}
      shard: {required: false, type: string, default: ''}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Browser probe
        if: ${{ inputs.mode == 'browser' }}
        run: |
          pip install --quiet playwright
          python3 -m playwright install chromium --with-deps >/dev/null 2>&1 || python3 -m playwright install chromium
          cat > /tmp/bp.py <<'PY'
import json, re, sys, time
from playwright.sync_api import sync_playwright
LINK = sys.argv[1]
calls = []
with sync_playwright() as p:
    b = p.chromium.launch(headless=True, args=['--no-sandbox'])
    ctx = b.new_context(locale='en-US')
    page = ctx.new_page()
    def on_response(r):
        u = r.url
        if 'api.mega.co.nz' in u:
            try:
                body = r.json()
            except Exception:
                try: body = r.text()[:300]
                except Exception: body = '?'
            calls.append({
                'url': u[:120],
                'status': r.status,
                'post': (r.request.post_data or '')[:300],
                'resp': json.dumps(body)[:500] if not isinstance(body, str) else body,
                'origin': r.request.headers.get('origin', ''),
                'ua': r.request.headers.get('user-agent', '')[:40],
            })
    page.on('response', on_response)
    page.goto(LINK, wait_until='domcontentloaded', timeout=90000)
    page.wait_for_timeout(20000)
    print('TITLE:', page.title())
    print('=== API calls on load ===')
    for i, c in enumerate(calls):
        print(f"CALL{i}", json.dumps(c, ensure_ascii=False)[:700])
    # 找文件并触发下载
    before = len(calls)
    try:
        el = page.locator('text=Anby').first
        el.click(timeout=10000)
        page.wait_for_timeout(8000)
        print('clicked file; url now:', page.url[:100])
    except Exception as e:
        print('click file failed:', str(e)[:150])
    # 找下载按钮
    for sel in ('button.download', '.download-button', '[class*=download]', 'text=Download'):
        try:
            page.locator(sel).first.click(timeout=4000)
            page.wait_for_timeout(8000)
            print(f'clicked {sel}')
            break
        except Exception:
            continue
    print('=== API calls after interactions ===')
    for i, c in enumerate(calls[before:]):
        print(f"CALL+{i}", json.dumps(c, ensure_ascii=False)[:700])
    with page.expect_download(timeout=20000) as dl_info:
        pass
    b.close()
PY
          python3 /tmp/bp.py "$LINK" 2>&1 | grep -v Warning | head -60
