name: mega
on:
  workflow_dispatch:
    inputs:
      mode:  {required: true, type: string}
      link:  {required: true, type: string}
      tag:   {required: false, type: string, default: ''}
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Install megacmd
        run: |
          DEB=$(wget -qO- "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/" | grep -oE 'megacmd_[0-9][^"]*_amd64\.deb' | sort -uV | tail -1)
          wget -q "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/$DEB" -O /tmp/megac.deb
          sudo apt-get install -y -qq /tmp/megac.deb
      - name: Debug probe
        if: ${{ inputs.mode == 'debugprobe' }}
        env:
          LINK: ${{ inputs.link }}
        run: |
          mkdir -p /tmp/dlx
          timeout 75 mega-debug get "$LINK" /tmp/dlx > /tmp/dbg.log 2>&1 || true
          echo "=== API 命令序列 ==="
          grep -aoE "POST https://g.api.mega.co.nz/cs[^ ]*" /tmp/dbg.log | head -5
          grep -aoE '"a":"[a-z]+"' /tmp/dbg.log | sort | uniq -c | sort -rn | head -15
          echo "=== us/登录相关 ==="
          grep -aiE "\\"a\\":\\"us|ephemeral|session|sid" /tmp/dbg.log | head -8
          echo "=== g 命令上下文 ==="
          grep -aB2 -A6 '"a":"g"' /tmp/dbg.log | head -40
