name: mega
on:
  workflow_dispatch:
    inputs:
      mode:  {required: true, type: string}
      link:  {required: true, type: string}
      shard: {required: false, type: string, default: ''}
      tag:   {required: false, type: string, default: ''}
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Install megacmd
        run: |
          DEB=$(wget -qO- "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/" | grep -oE 'megacmd_[0-9][^"]*_amd64\.deb' | sort -uV | tail -1)
          wget -q "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/$DEB" -O /tmp/megac.deb
          sudo apt-get install -y -qq /tmp/megac.deb
      - name: Dummy test
        if: ${{ inputs.mode == 'dummy-test' }}
        env:
          LINK: ${{ inputs.link }}
        run: |
          mkdir -p "/tmp/dl/Old Youtube Videos/Youtube Shorts"
          truncate -s 11009147 "/tmp/dl/Old Youtube Videos/Youtube Shorts/Anby She Wolf (Sakura G).mp4"
          echo "占位后: $(du -sb /tmp/dl | cut -f1) 字节(表观)"
          timeout 70 mega-get "$LINK" /tmp/dl 2>&1 | grep -vE "^TRANSFERRING|^Setup|^_|^\s*$" | head -15 || true
          echo "=== 下载后总表观字节 ==="
          du -sb /tmp/dl | cut -f1
          echo "=== 实际文件列表 ==="
          find /tmp/dl -type f -printf "%s %p\n" | head -12
          echo "=== 占位文件状态(大小/修改时间) ==="
          stat -c "%s %Y %n" "/tmp/dl/Old Youtube Videos/Youtube Shorts/Anby She Wolf (Sakura G).mp4"
      - name: Shard relay
        if: ${{ inputs.mode == 'shard' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LINK: ${{ inputs.link }}
          SHARD: ${{ inputs.shard }}
          TAG: ${{ inputs.tag }}
        run: |
          set -uo pipefail
          gh release create "$TAG" --title "$TAG" --notes mega 2>/dev/null || true
          # 生成占位: 非本分片的所有文件
          mkdir -p /tmp/dl
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > /tmp/done_assets.txt 2>/dev/null || true
          awk -F'\t' -v s="$SHARD" '{done=(index(FILENUM,"")==0)}1' /dev/null 2>/dev/null || true
          while IFS=$'\t' read -r h size asset name path sh; do
            if [ "$sh" != "$SHARD" ] || grep -q "^${asset}\.part-" /tmp/done_assets.txt 2>/dev/null; then
              mkdir -p "/tmp/dl/$path"
              truncate -s "$size" "/tmp/dl/$path/$name"
            fi
          done < mega_files.tsv
          touch /tmp/dl_start_marker
          echo "占位完成, 启动 mega-get (进度直出)"
          stdbuf -oL mega-get "$LINK" /tmp/dl 2>&1 | stdbuf -oL grep -vE "^TRANSFERRING\s*\|+\|" &
          MGPID=$!
          # 等待本分片所有文件就绪(精确大小) 或 50 分钟超时
          START=$(date +%s)
          while true; do
            TODO=0
            while IFS=$'\t' read -r h size asset name path sh; do
              [ "$sh" = "$SHARD" ] || continue
              [ -f "/tmp/dl/$path/$name" ] || TODO=1
            done < mega_files.tsv
            [ "$TODO" = 0 ] && break
            NOW=$(date +%s)
            DLREAL=$(du -sB1 /tmp/dl 2>/dev/null | cut -f1)
            echo "[t=$((NOW - START))s] 实际下载字节: $DLREAL, 存活: $(kill -0 $MGPID 2>/dev/null && echo yes || echo DEAD)"
            find /tmp/dl -type f -newer /tmp/dl_start_marker -printf "%s %p\n" 2>/dev/null | sort -rn | head -4
            if [ "$DLREAL" = "${LAST:-x}" ]; then
              FROZEN=$((FROZEN + 1))
              [ $FROZEN -ge 3 ] && { echo "下载冻结, 中止"; kill $MGPID 2>/dev/null; break; }
            else
              FROZEN=0
            fi
            LAST=$DLREAL
            [ $((NOW - START)) -gt 3000 ] && break
            kill -0 $MGPID 2>/dev/null || { echo "mega-get 已退出"; sleep 3; break; }
            sleep 15
          done
          kill $MGPID 2>/dev/null || true
          sleep 3
          echo "=== 上传本分片完成的文件 ==="
          MISS=0; DONE=0
          while IFS=$'\t' read -r h size asset name path sh; do
            [ "$sh" = "$SHARD" ] || continue
            F="/tmp/dl/$path/$name"
            if [ -f "$F" ] && [ "$(stat -c%s "$F")" = "$size" ]; then
              split -b 1900m -d "$F" "/tmp/${asset}.part-"
              gh release upload "$TAG" /tmp/"${asset}".part-* --clobber && DONE=$((DONE+1)) || echo "UPLOAD_FAIL $name"
              rm -f /tmp/"${asset}".part-* "$F"
            else
              echo "MISSING $name"
              MISS=$((MISS+1))
            fi
          done < mega_files.tsv
          echo "SHARD $SHARD 完成=$DONE 缺失=$MISS"
          [ "$MISS" = 0 ] || exit 1
