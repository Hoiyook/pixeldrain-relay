name: mega
on:
  workflow_dispatch:
    inputs:
      mode:  {required: true, type: string}
      link:  {required: true, type: string}
      tag:   {required: false, type: string, default: ''}
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Install megacmd
        run: |
          DEB=$(wget -qO- "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/" | grep -oE 'megacmd_[0-9][^"]*_amd64\.deb' | sort -uV | tail -1)
          wget -q "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/$DEB" -O /tmp/megac.deb
          sudo apt-get install -y -qq /tmp/megac.deb
      - name: Belt
        env:
          GH_TOKEN: ${{ github.token }}
          LINK: ${{ inputs.link }}
          TAG: ${{ inputs.tag }}
        run: |
          set -uo pipefail
          gh release create "$TAG" --title "$TAG" --notes mega 2>/dev/null || true
          mkdir -p /tmp/dl /tmp/prefill
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > /tmp/done_assets.txt || true
          echo "已完成资产: $(wc -l < /tmp/done_assets.txt)"
          # 一次拉全部资产
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "*.part-*" -D /tmp/prefill --clobber >/dev/null 2>&1 || true
          while IFS=$'\t' read -r h size asset name path sh; do
            if ls /tmp/prefill/${asset}.part-* >/dev/null 2>&1; then
              mkdir -p "/tmp/dl/$path"
              cat /tmp/prefill/${asset}.part-* > "/tmp/dl/$path/$name"
              rm -f /tmp/prefill/${asset}.part-*
            fi
          done < mega_files.tsv
          rm -rf /tmp/prefill
          echo "预填占用: $(du -sB1 /tmp/dl | cut -f1)"
          # 下载直到配额死或全部完成 (40分钟保险)
          timeout 2400 mega-get "$LINK" /tmp/dl > /tmp/mg.log 2>&1 || true
          echo "mega-get 结束, 目录: $(du -sB1 /tmp/dl | cut -f1)"
          grep -c "quota" /tmp/mg.log 2>/dev/null | awk '{print "配额报错行: "$1}'
          # 上传所有新完成文件
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > /tmp/done2.txt || true
          UP=0; MISS=0
          while IFS=$'\t' read -r h size asset name path sh; do
            grep -q "^${asset}\.part-" /tmp/done2.txt && continue
            F="/tmp/dl/$path/$name"
            if [ -f "$F" ] && [ "$(stat -c%s "$F")" = "$size" ]; then
              split -b 1900m -d "$F" "/tmp/${asset}.part-"
              gh release upload "$TAG" /tmp/"${asset}".part-* --clobber >/dev/null 2>&1 && UP=$((UP+1)) || echo "UPLOAD_FAIL $name"
              rm -f /tmp/"${asset}".part-* "$F"
            else
              MISS=$((MISS+1))
            fi
          done < mega_files.tsv
          echo "BELT_RESULT uploaded=$UP missing=$MISS total_done=$(( $(wc -l < /tmp/done2.txt) + UP ))"
