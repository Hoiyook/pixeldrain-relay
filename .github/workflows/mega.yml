name: mega
on:
  workflow_dispatch:
    inputs:
      mode:  {required: true, type: string}
      link:  {required: true, type: string}
      tag:   {required: false, type: string, default: ''}
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Install megacmd
        run: |
          DEB=$(wget -qO- "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/" | grep -oE 'megacmd_[0-9][^"]*_amd64\.deb' | sort -uV | tail -1)
          wget -q "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/$DEB" -O /tmp/megac.deb
          sudo apt-get install -y -qq /tmp/megac.deb
      - name: Debug probe
        if: ${{ inputs.mode == 'debugprobe' }}
        env:
          LINK: ${{ inputs.link }}
        run: |
          echo "=== 包内二进制 ==="
          dpkg -L megacmd | grep -E "bin|debug" | head -10
          echo "=== mega-debug 存在? ==="
          which mega-debug && echo FOUND || echo "no mega-debug"
          echo "=== MEGACMD 日志级别测试 ==="
          timeout 45 mega-get "$LINK" /tmp/dl9 2>&1 | tail -2 || true
          echo "=== megacmdserver.log 中的 API 痕迹 ==="
          grep -aoE "\{\"a\\":[a-z0-9]+" /home/runner/.megaCmd/megacmdserver.log 2>/dev/null | sort | uniq -c | head -20
          grep -aiE "g.*url|request|cmd" /home/runner/.megaCmd/megacmdserver.log 2>/dev/null | head -10
