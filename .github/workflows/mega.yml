name: mega
on:
  workflow_dispatch:
    inputs:
      mode:  {required: true, type: string}
      link:  {required: true, type: string}
      tag:   {required: false, type: string, default: ''}
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Install megacmd
        run: |
          DEB=$(wget -qO- "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/" | grep -oE 'megacmd_[0-9][^"]*_amd64\.deb' | sort -uV | tail -1)
          wget -q "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/$DEB" -O /tmp/megac.deb
          sudo apt-get install -y -qq /tmp/megac.deb
      - name: Belt
        env:
          GH_TOKEN: ${{ github.token }}
          LINK: ${{ inputs.link }}
          TAG: ${{ inputs.tag }}
        run: |
          set -uo pipefail
          gh release create "$TAG" --title "$TAG" --notes mega 2>/dev/null || true
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > /tmp/done_assets.txt || true
          DONE_N=$(wc -l < /tmp/done_assets.txt)
          echo "已完成资产: $DONE_N"
          mkdir -p /tmp/dl /tmp/prefill
          # 预填: 已完成文件的真实内容 (内容相同 -> megacmd 跳过)
          n=0
          while IFS=$'\t' read -r h size asset name path sh; do
            if grep -q "^${asset}\.part-" /tmp/done_assets.txt; then
              mkdir -p "/tmp/dl/$path"
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "${asset}.part-*" -D /tmp/prefill --clobber >/dev/null 2>&1
              cat /tmp/prefill/${asset}.part-* > "/tmp/dl/$path/$name"
              rm -f /tmp/prefill/${asset}.part-*
              n=$((n+1))
            fi
          done < mega_files.tsv
          echo "预填文件数: $n, 占用: $(du -sB1 /tmp/dl | cut -f1)"
          touch /tmp/m0
          echo "=== mega-get 启动 (60秒采样) ==="
          timeout 60 mega-get "$LINK" /tmp/dl > /tmp/mg.log 2>&1 || true
          echo "下载字节: $(du -sB1 /tmp/dl | cut -f1)"
          echo "=== 预填文件是否被动过(mtime不变=被跳过) ==="
          while IFS=$'\t' read -r h size asset name path sh; do
            if grep -q "^${asset}\.part-" /tmp/done_assets.txt; then
              F="/tmp/dl/$path/$name"
              [ -f "$F" ] && echo "$(stat -c%s "$F") $(stat -c%Y "$F") $path/$name"
            fi
          done < mega_files.tsv | head -8
          echo "=== 新完成的文件(前10) ==="
          find /tmp/dl -type f -newer /tmp/m0 -printf "%s %p\n" 2>/dev/null | sort -rn | head -10
          tail -5 /tmp/mg.log
