name: mega
on:
  workflow_dispatch:
    inputs:
      mode:  {required: true, type: string}
      link:  {required: true, type: string}
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pycryptodome 2>/dev/null || pip install --quiet --break-system-packages pycryptodome || true
      - name: Probe with keys
        if: ${{ inputs.mode == 'probe' }}
        run: python3 mega_api.py ls "${{ inputs.link }}"
