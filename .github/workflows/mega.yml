name: mega
on:
  workflow_dispatch:
    inputs:
      mode:  {description: 'probe|debug|get', required: true, type: string}
      link:  {required: true, type: string}
      handle: {required: false, type: string, default: ''}
      asset: {required: false, type: string, default: ''}
      tag:   {required: false, type: string, default: ''}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pycryptodome
      - name: Run
        env:
          GH_TOKEN: ${{ github.token }}
          MODE:   ${{ inputs.mode }}
          LINK:   ${{ inputs.link }}
          HANDLE: ${{ inputs.handle }}
          ASSET:  ${{ inputs.asset }}
          TAG:    ${{ inputs.tag }}
        run: |
          M="$MODE"; [ "$M" = "probe" ] && M="ls"
          if [ "$M" = "ls" ] || [ "$M" = "debug" ]; then
            python3 mega_api.py "$M" "$LINK"
          else
            set -euo pipefail
            echo "$ASSET" | grep -qE '^[A-Za-z0-9._()-]+$' || { echo "bad asset name"; exit 1; }
            gh release create "$TAG" --title "$TAG" --notes mega 2>/dev/null || true
            TMP="/tmp/dl_$HANDLE"
            python3 mega_api.py get "$LINK" "$HANDLE" -o "$TMP" | tee /tmp/getlog.txt
            grep -q DOWNLOAD_OK /tmp/getlog.txt || { echo GET_FAILED; exit 1; }
            actual=$(stat -c%s "$TMP"); expect=$(grep '^SIZE ' /tmp/getlog.txt | awk '{print $2}')
            [ "$actual" = "$expect" ] || { echo SIZE_MISMATCH; exit 1; }
            split -b 1900m -d "$TMP" "/tmp/${ASSET}.part-"
            rm -f "$TMP"
            gh release upload "$TAG" /tmp/"${ASSET}".part-* --clobber
            rm -f /tmp/"${ASSET}".part-*
            echo "UPLOADED $ASSET"
          fi
