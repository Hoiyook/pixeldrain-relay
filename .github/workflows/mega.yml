name: mega
on:
  workflow_dispatch:
    inputs:
      mode:  {required: true, type: string}
      link:  {required: true, type: string}
      tag:   {required: false, type: string, default: ''}
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Install megacmd
        run: |
          DEB=$(wget -qO- "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/" | grep -oE 'megacmd_[0-9][^"]*_amd64\.deb' | sort -uV | tail -1)
          wget -q "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/$DEB" -O /tmp/megac.deb
          sudo apt-get install -y -qq /tmp/megac.deb
      - name: Perfile test
        if: ${{ inputs.mode == 'perfile' }}
        env:
          LINK: ${{ inputs.link }}
        run: |
          mkdir -p /tmp/dl4
          echo "=== 变体1: 原样路径 ==="
          timeout 60 mega-get "${LINK}/Old Youtube Videos/Youtube Shorts/Anby She Wolf (Sakura G).mp4" /tmp/dl4 2>&1 | tail -2 || true
          find /tmp/dl4 -type f -printf "%s %p\n" | head -5
          echo "=== 变体2: URL编码 ==="
          mkdir -p /tmp/dl5
          timeout 60 mega-get "${LINK}/Old%20Youtube%20Videos/Youtube%20Shorts/Anby%20She%20Wolf%20%28Sakura%20G%29.mp4" /tmp/dl5 2>&1 | tail -2 || true
          find /tmp/dl5 -type f -printf "%s %p\n" | head -5
