name: mega
on:
  workflow_dispatch:
    inputs:
      mode:  {required: true, type: string}
      link:  {required: true, type: string}
      tag:   {required: false, type: string, default: ''}
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Single file relay
        if: ${{ inputs.mode == 'single' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LINK: ${{ inputs.link }}
          TAG: ${{ inputs.tag }}
        run: |
          set -uo pipefail
          gh release create "$TAG" --title "$TAG" --notes single 2>/dev/null || true
          python3 mega_single.py "$LINK" -o /tmp/dl.bin | tee /tmp/single.log
          grep -q DOWNLOAD_OK /tmp/single.log || { echo GET_FAILED; exit 1; }
          actual=$(stat -c%s /tmp/dl.bin)
          expect=$(grep '^SIZE ' /tmp/single.log | awk '{print $2}')
          [ "$actual" = "$expect" ] || { echo SIZE_MISMATCH; exit 1; }
          NAME=$(grep '^NAME ' /tmp/single.log | sed 's/^NAME //' | python3 -c "import sys,json;print(json.load(sys.stdin))")
          SAFE=$(echo "$NAME" | tr -c 'A-Za-z0-9._()-' '_' | sed 's/_\+/_/g; s/^_//; s/_$//; s/$/.PREFIX/' | sed 's/\.PREFIX$//')
          SAFE="${SAFE:0:80}"
          echo "文件名: $NAME -> 资产: $SAFE"
          split -b 1900m -d /tmp/dl.bin "/tmp/${SAFE}.part-"
          rm -f /tmp/dl.bin
          gh release upload "$TAG" /tmp/"${SAFE}".part-* --clobber
          rm -f /tmp/"${SAFE}".part-*
          echo "UPLOADED $SAFE ($actual bytes)"
