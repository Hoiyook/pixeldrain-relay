name: mega
on:
  workflow_dispatch:
    inputs:
      mode:  {required: true, type: string}
      link:  {required: true, type: string}
      handle: {required: false, type: string, default: ''}
      asset: {required: false, type: string, default: ''}
      finalname: {required: false, type: string, default: ''}
      tag:   {required: false, type: string, default: ''}
      shard: {required: false, type: string, default: ''}
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Install megadl
        run: |
          DEB=$(wget -qO- "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/" | grep -oE 'megasync_[0-9][^"]*_amd64\.deb' | sort -uV | tail -1)
          echo "deb: $DEB"
          wget -q "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/$DEB" -O /tmp/megasync.deb || true
          if [ ! -s /tmp/megasync.deb ]; then echo "megasync deb 下载失败, 回退 megacmd"; fi
          sudo apt-get install -y -qq /tmp/megasync.deb >/dev/null 2>&1 || sudo apt-get install -f -y -qq /tmp/megasync.deb || true
          which megadl || { echo "无 megadl, 装 megacmd"; MDEB=$(wget -qO- "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/" | grep -oE 'megacmd_[0-9][^"]*_amd64\.deb' | sort -uV | tail -1); wget -q "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/$MDEB" -O /tmp/megac.deb; sudo apt-get install -y -qq /tmp/megac.deb; }
          echo "megadl: $(which megadl || echo none), mega-get: $(which mega-get || echo none)"
      - name: Run
        env:
          GH_TOKEN: ${{ github.token }}
          MODE:  ${{ inputs.mode }}
          LINK:  ${{ inputs.link }}
          ASSET: ${{ inputs.asset }}
          TAG:   ${{ inputs.tag }}
          SHARD: ${{ inputs.shard }}
        run: |
          mkdir -p /tmp/dl
          if [ "$MODE" = "megadl-test" ]; then
            echo "=== A. megadl 匿名测试 (90秒后杀掉) ==="
            timeout 90 megadl "$LINK" --path /tmp/dl 2>&1 | head -20 || true
            echo "=== A. 下载结果 ==="
            find /tmp/dl -type f -exec ls -la {} \; 2>/dev/null | head -8
            du -sb /tmp/dl 2>/dev/null | awk '{print "A合计字节:", $1}'
            echo "=== B. mega-get 匿名测试 (90秒后杀掉) ==="
            mkdir -p /tmp/dl2
            timeout 90 mega-get "$LINK" /tmp/dl2 2>&1 | head -10 || true
            echo "=== B. 下载结果 ==="
            find /tmp/dl2 -type f -exec ls -la {} \; 2>/dev/null | head -8
            du -sb /tmp/dl2 2>/dev/null | awk '{print "B合计字节:", $1}'
          elif [ "$MODE" = "get" ]; then
            set -euo pipefail
            echo "$ASSET" | grep -qE '^[A-Za-z0-9._()-]+$' || { echo "bad asset name"; exit 1; }
            gh release create "$TAG" --title "$TAG" --notes mega 2>/dev/null || true
            timeout 3000 megadl "$LINK" --path /tmp/dl 2>&1 | tail -3 || true
            TMP="/tmp/dl/${{ inputs.finalname }}"
            [ -f "$TMP" ] || { echo "FILE_MISSING $TMP"; find /tmp/dl -type f | head -5; exit 1; }
            actual=$(stat -c%s "$TMP")
            echo "DOWNLOADED $ASSET $actual bytes"
            split -b 1900m -d "$TMP" "/tmp/${ASSET}.part-"
            rm -f "$TMP"
            gh release upload "$TAG" /tmp/"${ASSET}".part-* --clobber
            rm -f /tmp/"${ASSET}".part-*
            echo "UPLOADED $ASSET"
          fi
