name: pdrelay
on:
  workflow_dispatch:
    inputs:
      pid:   {description: 'pixeldrain file id', required: true, type: string}
      fname: {description: 'filename', required: true, type: string}
      fsize: {description: 'size in bytes', required: true, type: string}
      fsha:  {description: 'sha256 (optional)', required: false, type: string, default: ''}
      tag:   {description: 'release tag', required: true, type: string}
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: write}
    steps:
      - name: Relay one file
        env:
          GH_TOKEN: ${{ github.token }}
          PID:   ${{ inputs.pid }}
          FNAME: ${{ inputs.fname }}
          FSIZE: ${{ inputs.fsize }}
          FSHA:  ${{ inputs.fsha }}
          TAG:   ${{ inputs.tag }}
        run: |
          set -uo pipefail
          gh release create "$TAG" --title "$TAG" --notes pd || echo "CREATE_FAIL(见上)"
          exist=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq "[.assets[].name | select(startswith(\"$FNAME.part-\"))] | length" 2>/dev/null || echo 0)
          if [ "${exist:-0}" -gt 0 ]; then echo "SKIP $FNAME (已中转)"; exit 0; fi
          ok=0
          for attempt in 1 2 3; do
            rm -f /tmp/pd.bin
            curl -sS -L --retry 5 --retry-delay 5 -o /tmp/pd.bin "https://pixeldrain.com/api/file/$PID?download" || true
            sz=$(stat -c%s /tmp/pd.bin 2>/dev/null || echo 0)
            [ "$sz" = "$FSIZE" ] || { echo "尺寸不符 $sz/$FSIZE (attempt $attempt)"; continue; }
            if [ -n "$FSHA" ]; then
              calc=$(sha256sum /tmp/pd.bin | awk '{print $1}')
              [ "$calc" = "$FSHA" ] || { echo "SHA不符 (attempt $attempt)"; continue; }
            fi
            ok=1; break
          done
          [ "$ok" = 1 ] || { echo "FILE_FAILED $FNAME"; exit 1; }
          split -b 1900m -d /tmp/pd.bin "/tmp/$FNAME.part-"
          rm -f /tmp/pd.bin
          i=0
          for f in /tmp/$FNAME.part-*; do
            gh release upload "$TAG" "$f" --clobber && i=$((i+1)) || echo "UPLOAD_FAIL $f"
          done
          rm -f /tmp/$FNAME.part-*
          echo "RELAY_OK $FNAME chunks=$i"
